<!DOCTYPE html>
<html>
<head>
    <title>List tags</title>
</head>
<body style="background-color:lightgreen;">

    <p><b>Numbered list:</b></p>
    <ol>
        <li>Apples</li>
        <li>Bananas</li>
        <li>Lemons</li>
        <li>Oranges</li>
    </ol>

    <p><b>Letters list:</b></p>
    <ol type="A">
        <li>Apples</li>
        <li>Bananas</li>
        <li>Lemons</li>
        <li>Oranges</li>
    </ol>

</body>
</html>
